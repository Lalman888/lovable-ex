name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3 # Use v3 as specified

      - name: Set up Python 3.11
        uses: actions/setup-python@v4 # Use v4 as specified
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run flake8
        # Assumes tests directory exists or will be created
        # Assumes flake8 is in requirements.txt
        run: flake8 app tests

      - name: Run mypy
        # Assumes mypy is in requirements.txt
        run: mypy app

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    # Service containers for dependencies
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:latest # Or pin to 7.3.2 like in docker-compose
        ports: ['2181:2181']
        environment:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        # Note: A specific healthcheck for Zookeeper might require a custom command/tool

      kafka:
        image: confluentinc/cp-kafka:latest # Or pin to 7.3.2 like in docker-compose
        ports: ['9092:9092', '29092:29092']
        # Depends on zookeeper service defined above
        environment:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # Connect to the service container
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT # Necessary for internal communication
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # Required for single-node setup
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        # Note: A robust Kafka healthcheck might involve checking topic creation or broker status via tools

    steps:
      - name: Check out code
        uses: actions/checkout@v3 # Use v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4 # Use v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          # Ensure pytest and testcontainers[mongo,redis,kafka] are in requirements.txt

      - name: Wait for services to be healthy (optional but recommended)
        # Add waits if healthchecks aren't fully reliable or need more time
        run: |
          echo "Waiting for MongoDB..."
          until mongosh --host mongo --port 27017 --eval 'db.runCommand("ping").ok' --quiet; do sleep 1; done
          echo "Waiting for Redis..."
          until redis-cli -h redis -p 6379 ping; do sleep 1; done
          # Add wait for Kafka/Zookeeper if necessary (e.g., check port listening)
          echo "Services should be up."
        timeout-minutes: 1 # Fail if services don't start quickly

      - name: Run tests
        # Set environment variables for the application/tests to connect to services
        env:
          MONGO_URI: mongodb://mongo:27017/testdb # Use service name 'mongo', specific test DB
          REDIS_URL: redis://redis:6379/0 # Use service name 'redis'
          KAFKA_BOOTSTRAP_SERVERS: kafka:9092 # Use service name 'kafka' and internal port
          SECRET_KEY: test_secret_key_for_ci # Use a dummy secret for testing
          ACCESS_TOKEN_EXPIRE_MINUTES: 30 # Example, match config if needed
          ALGORITHM: HS256 # Example, match config if needed
          # Add other necessary env vars from .env.example if tests require them
        # Assumes tests are in the 'tests/' directory
        # Assumes pytest is in requirements.txt
        run: pytest --maxfail=1 --disable-warnings -v tests/

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3 # Use v3

      - name: Set up Docker Buildx
        # Use latest version of buildx setup action is generally fine unless specific version needed
        uses: docker/setup-buildx-action@v3

      # TODO: Configure Docker login for pushing to a registry
      # - name: Log in to Docker Hub (or other registry)
      #   uses: docker/login-action@v3 # Use v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }} # Store token as encrypted secret

      - name: Build with Docker Compose
        # Use docker-compose to build the image(s) defined in docker-compose.yml
        # This ensures consistency with local development builds
        # Specify target services from docker-compose.yml
        run: docker-compose -f docker-compose.yml build fastapi-app celery-worker

      # TODO: Configure push step if needed (requires login)
      # - name: Push images (if login is configured)
      #   run: docker-compose -f docker-compose.yml push fastapi-app celery-worker
